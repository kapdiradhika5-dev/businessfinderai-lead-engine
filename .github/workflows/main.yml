
name: BusinessFinderAI India Lead Export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install OSM reader
        run: python -m pip install --disable-pip-version-check osmium

      - name: Download India OSM data
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://download.geofabrik.de/asia/india-latest.osm.pbf"
          path = "/tmp/india-latest.osm.pbf"

          print("Downloading India map data...")
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "BusinessFinderAI/1.0"}
          )

          with urllib.request.urlopen(request, timeout=180) as response:
              with open(path, "wb") as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      output.write(chunk)

          print("Download completed.")
          PY

      - name: Export business records to CSV
        run: |
          python - <<'PY'
          import csv
          import osmium

          INPUT = "/tmp/india-latest.osm.pbf"
          OUTPUT = "business_leads.csv"

          AMENITIES = {
              "restaurant", "cafe", "fast_food", "bar", "pub",
              "bank", "pharmacy", "clinic", "hospital", "dentist",
              "veterinary", "fuel", "car_wash", "car_repair",
              "beauty_salon", "marketplace", "post_office",
              "coworking_space", "money_transfer"
          }

          CATEGORY_KEYS = (
              "shop", "office", "craft", "tourism", "healthcare"
          )

          ONLINE_KEYS = (
              "website", "contact:website", "url",
              "phone", "contact:phone", "email", "contact:email",
              "facebook", "contact:facebook",
              "instagram", "contact:instagram",
              "linkedin", "contact:linkedin"
          )

          FIELDS = [
              "osm_type", "osm_id", "name", "category",
              "subcategory", "address", "city", "state",
              "postcode", "phone", "email", "website",
              "latitude", "longitude", "has_online_contact"
          ]

          def first_tag(tags, *keys):
              for key in keys:
                  value = tags.get(key)
                  if value:
                      return value
              return ""

          class BusinessExporter(osmium.SimpleHandler):
              def __init__(self):
                  super().__init__()
                  self.file = open(
                      OUTPUT, "w", newline="", encoding="utf-8-sig"
                  )
                  self.writer = csv.DictWriter(
                      self.file, fieldnames=FIELDS
                  )
                  self.writer.writeheader()
                  self.count = 0

              def process(self, obj, osm_type, latitude="", longitude=""):
                  tags = obj.tags
                  category = ""
                  subcategory = ""

                  for key in CATEGORY_KEYS:
                      if tags.get(key):
                          category = key
                          subcategory = tags.get(key)
                          break

                  if not category and tags.get("amenity") in AMENITIES:
                      category = "amenity"
                      subcategory = tags.get("amenity")

                  if not category:
                      return

                  name = first_tag(tags, "name", "name:en")
                  if not name:
                      return

                  address_parts = [
                      first_tag(tags, "addr:housenumber"),
                      first_tag(tags, "addr:street"),
                      first_tag(tags, "addr:suburb"),
                  ]
                  address = ", ".join(part for part in address_parts if part)

                  phone = first_tag(
                      tags, "phone", "contact:phone", "mobile"
                  )
                  email = first_tag(
                      tags, "email", "contact:email"
                  )
                  website = first_tag(
                      tags, "website", "contact:website", "url"
                  )

                  online_contact = any(
                      tags.get(key) for key in ONLINE_KEYS
                  )

                  self.writer.writerow({
                      "osm_type": osm_type,
                      "osm_id": obj.id,
                      "name": name,
                      "category": category,
                      "subcategory": subcategory,
                      "address": address,
                      "city": first_tag(
                          tags, "addr:city", "addr:town", "addr:village"
                      ),
                      "state": first_tag(tags, "addr:state"),
                      "postcode": first_tag(tags, "addr:postcode"),
                      "phone": phone,
                      "email": email,
                      "website": website,
                      "latitude": latitude,
                      "longitude": longitude,
                      "has_online_contact": "Yes" if online_contact else "No"
                  })
                  self.count += 1

              def node(self, obj):
                  if obj.location.valid():
                      lat = obj.location.lat
                      lon = obj.location.lon
                  else:
                      lat, lon = "", ""
                  self.process(obj, "node", lat, lon)

              def way(self, obj):
                  self.process(obj, "way")

              def relation(self, obj):
                  self.process(obj, "relation")

              def close(self):
                  self.file.close()

          exporter = BusinessExporter()
          print("Extracting named business records...")
          try:
              exporter.apply_file(INPUT, locations=True)
          finally:
              exporter.close()

          print(f"CSV created: {OUTPUT}")
          print(f"Named records exported: {exporter.count}")
          print("Some records may refer to the same real-world business.")
          print("Missing contact details are left blank.")
          PY

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: businessfinderai-leads
          path: business_leads.csv
          if-no-files-found: error
          retention-days: 7

      - name: Delete downloaded map data
        if: always()
        run: rm -f /tmp/india-latest.osm.pbf
